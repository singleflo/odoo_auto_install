# automatically generated file by the runbot nightly ruff checks, do not modify
# for ruff version 0.14.10 (versione installata nel venv locale; Odoo master usa 0.15.0+ ma RUF067 non ancora disponibile qui)
# note: 'E241', 'E272', 'E201', 'E221' are ignored on runbot in test files when formating a table like structure (more than two space)
# some rules present here are not enabled on runbot (yet) but are still advised to follow when possible : ["B904", "COM812", "E741", "EM101", "I001", "RET", "RUF021", "RUF102", "TRY002", "UP006", "UP007"]
# custom Singleflo (non presenti in Odoo master, mantenute): BLE001, EM101, EXE001, F841, G004, PLC0415, PLW0602, RET504, S704(ex-RUF035), SIM105, T201, T203, TRY002, TRY301, TRY401
# rimossa UP038 (regola eliminata da ruff >=0.12, causava warning "has been removed and ignoring them has no effect")


target-version = "py312"

[lint]
preview = true
external = ["OLS"]
select = [
    "BLE",        # flake8-blind-except
    "C",          # flake8-comprehensions
    "COM",        # flake8-commas
    "E",          # pycodestyle Error
    "EM",         # flake8-errmsg
    "EXE",        # flake8-executable
    "F",          # Pyflakes
    "FA",         # flake8-future-annotations
    "FLY",        # flynt
    "G",          # flake8-logging-format
    "I",          # isort
    "ICN",        # flake8-import-conventions
    "INT",        # flake8-gettext
    "ISC",        # flake8-implicit-str-concat
    "LOG",        # flake8-logging
    "PGH",        # pygrep-hooks
    "PIE",        # flake8-pie
    "PLC",        # Pylint Convention
    "PLE",        # Pylint Error
    "PLW",        # Pylint Warning
    "PYI",        # flake8-pyi
    "RET",        # flake8-return
    "RUF",        # Ruff-specific rules
    "SIM",        # flake8-simplify
    "SLOT",       # flake8-slots
    "T",          # flake8-print
    "TC",         # flake8-type-checking
    "TID",        # flake8-tidy-imports
    "TRY",        # tryceratops
    "UP",         # pyupgrade
    "W",          # pycodestyle Warning
    "YTT",        # flake8-2020
]
ignore = [
    "C408",       # unnecessary-collection-call
    "C420",       # unnecessary-dict-comprehension-for-iterable
    "C901",       # complex-structure
    "E266",       # multiple-leading-hashes-for-block-comment
    "E501",       # line-too-long
    "E713",       # not-in-test
    "EM101",      # string-literal-in-exception
    "EM102",      # f-string-in-exception
    "FA100",      # future-rewritable-type-annotation
    "G004",       # logging-f-string (common pattern in Odoo)
    "PGH003",     # blanket-type-ignore
    "PIE790",     # unnecessary-placeholder
    "PIE808",     # unnecessary-range-start
    "PLC0415",    # import-outside-toplevel (lazy imports common in Odoo)
    "PLC2701",    # import-private-name
    "PLW2901",    # redefined-loop-name
    "RUF001",     # ambiguous-unicode-character-string
    "RUF005",     # collection-literal-concatenation
    "RUF012",     # mutable-class-default
    "S704",       # markup-unsafe, ex-RUF035 (Odoo uses Markup extensively; ruff 0.15 ha rimappato RUF035->S704)
    "RUF100",     # unused-noqa
    "SIM102",     # collapsible-if
    "SIM105",     # contextlib-suppress (try/except pass is clearer)
    "SIM108",     # if-else-block-instead-of-if-exp
    "SIM117",     # multiple-with-statements
    "TID252",     # relative-imports
    "TRY002",     # create-your-own-exception
    "TRY003",     # raise-vanilla-args
    "TRY300",     # try-consider-else
    "TRY400",     # error-instead-of-exception
    "UP031",      # printf-string-formatting
    "T201",       # print-found (allow print statements)
    "T203",       # pprint-found (allow pprint statements)
    "BLE001",     # blind-except (common in Odoo error handling)
    "EXE001",     # shebang-executable (scripts may not be chmod +x)
    "F841",       # unused-variable (tuple unpacking common)
    "TRY301",     # raise-in-try (UserError pattern in Odoo)
    "TRY401",     # exception-in-log (common pattern)
    "RET504",     # unnecessary-assign-before-return (clearer code)
    "PLW0602",    # global-variable-not-assigned (module-level state)
    "G201",       # logging-exc-info (explicit exc_info is clearer)
]

[lint.per-file-ignores]
"**/__init__.py" = [
    "F401",       # unused-import
    "I001",       # unsorted-imports - Odoo requires specific load order for mixins
]
"**/test_*.py" = [
    "E722",       # bare-except (common in tests)
    "BLE001",     # blind-except (common in tests)
]
"**/benchmark_*.py" = [
    "E722",       # bare-except
    "BLE001",     # blind-except
]

[lint.isort]
# https://www.odoo.com/documentation/master/contributing/development/coding_guidelines.html#imports
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
known-first-party = ["odoo"]
known-local-folder = ["odoo.addons"]
